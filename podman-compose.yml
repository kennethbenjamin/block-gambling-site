version: '3.8'

networks:
  virtual_lan:
    driver: bridge

services:
  # 1. AI Classifier & Web Unlock Portal Gateway
  filter-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: filter-gateway
    env_file: .env
    ports:
      - "8080:8080"
    networks:
      - virtual_lan
    restart: unless-stopped

  # 1b. Squid Filter Proxy (asks filter-gateway per domain)
  filter-proxy:
    build:
      context: ./proxy
      dockerfile: Containerfile
    container_name: filter-proxy
    environment:
      - GATEWAY_URL=http://192.168.1.8:8080
      - GATEWAY_API=http://filter-gateway:8080
    ports:
      - "3128:3128"
    networks:
      - virtual_lan
    restart: unless-stopped
    depends_on:
      - filter-gateway

  # 2. Local AI Engine (Ollama)
  local-ai:
    image: docker.io/ollama/ollama:latest
    container_name: local-ai
    volumes:
      - /media/daddy/data/application/ollama_data:/root/.ollama:Z
    ports:
      - "11434:11434"
    networks:
      - virtual_lan
    restart: unless-stopped

  # 3. Simulated Client (to test blocking & bypass prevention)
  test-client:
    image: docker.io/library/alpine:latest
    container_name: test-client
    stdin_open: true
    tty: true
    command: /bin/sh -c "apk add --no-cache curl bind-tools && sleep infinity"
    networks:
      - virtual_lan
    depends_on:
      - filter-gateway
