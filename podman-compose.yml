version: '3.8'

networks:
  virtual_lan:
    driver: bridge

services:
  # 1. AI Classifier & Web Unlock Portal Gateway
  filter-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: filter-gateway
    env_file: .env
    ports:
      - "8080:8080"
      - "443:443"
      - "127.0.0.1:53:53/udp"
      - "192.168.1.8:53:53/udp"
    volumes:
      - ./certs:/certs
    networks:
      - virtual_lan
    restart: unless-stopped

  # 2. Simulated Client (to test blocking & bypass prevention)
  test-client:
    image: docker.io/library/alpine:latest
    container_name: test-client
    stdin_open: true
    tty: true
    command: /bin/sh -c "apk add --no-cache curl bind-tools && sleep infinity"
    networks:
      - virtual_lan
    depends_on:
      - filter-gateway
